name: lock-upgrade

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Optional --package NAME"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  upgrade:
    uses: Emerging-Patterns/actions/.github/workflows/lock-upgrade.yml@73b2fbc64cefd6e22bd786437adb5f35190ee837
    with:
      package: ${{ inputs.package }}
