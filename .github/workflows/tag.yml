# workflow_dispatch: resolve X.Y.Z from flake.nix, optionally bump it, publish
# ez/main.bend to bendhub, then create the GitHub Release (and tag) via
# softprops/action-gh-release. Release name is `vX.Y.Z 0x…` (tag stays vX.Y.Z).
# A GITHUB_TOKEN tag push does not start release.yml.
#
# How to cut a release
#   1. Land the version on master in flake.nix (or use bump below).
#   2. Actions → Tag → Run workflow, from master:
#        - leave version empty and bump=none → tag what flake.nix says
#        - version=X.Y.Z → tag that (fails if flake.nix differs)
#        - bump=patch|minor|major → rewrite flake.nix, commit, tag
#   3. Or tag locally: `git tag -a vX.Y.Z -m vX.Y.Z && git push origin vX.Y.Z`
#      (release.yml then publishes and opens the GitHub Release).

name: tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: "X.Y.Z to tag (empty = version in flake.nix)"
        required: false
        type: string
        default: ""
      bump:
        description: "If version is empty, bump flake.nix then tag"
        required: false
        type: choice
        options:
          - none
          - patch
          - minor
          - major
        default: none

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@v22

      - name: Resolve version
        id: ver
        env:
          VERSION_IN: ${{ inputs.version }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          flake_ver=$(grep -oE 'version = "[0-9]+\.[0-9]+\.[0-9]+"' flake.nix \
            | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ -z "$flake_ver" ]; then
            echo "could not read version from flake.nix"
            exit 1
          fi
          file_ver="$flake_ver"

          ver=$(printf '%s' "$VERSION_IN" | tr -d '[:space:]')
          ver="${ver#v}"
          bump_files=0
          if [ -n "$ver" ]; then
            :
          elif [ "${BUMP:-none}" != none ]; then
            IFS=. read -r maj min pat <<< "$file_ver"
            case "$BUMP" in
              major) ver="$((maj + 1)).0.0" ;;
              minor) ver="$maj.$((min + 1)).0" ;;
              patch) ver="$maj.$min.$((pat + 1))" ;;
              *) echo "unknown bump: $BUMP"; exit 1 ;;
            esac
            bump_files=1
          else
            ver="$file_ver"
          fi

          if ! echo "$ver" | grep -qxE '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "version must be X.Y.Z, got: $ver"
            exit 1
          fi
          if [ "$bump_files" -eq 0 ] && [ "$ver" != "$file_ver" ]; then
            echo "asked to tag v$ver but flake.nix is $file_ver"
            echo "bump flake.nix first, or use bump="
            exit 1
          fi

          if [ "$bump_files" -eq 1 ]; then
            sed -i -E 's/version = "[0-9]+\.[0-9]+\.[0-9]+"/version = "'"$ver"'"/' flake.nix
            if ! grep -q "version = \"$ver\"" flake.nix; then
              echo "failed to write flake.nix version $ver"
              exit 1
            fi
          fi

          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "bump_files=$bump_files" >> "$GITHUB_OUTPUT"
          notes=false
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$ver" '
              $0 ~ "^##[ \\[ ]+v?" ver {found=1; print; next}
              found && /^## / {exit}
              found {print}
            ' CHANGELOG.md > /tmp/release-notes.md
            if [ -s /tmp/release-notes.md ]; then
              notes=true
            fi
          fi
          echo "notes=${notes}" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        id: commit
        if: steps.ver.outputs.bump_files == '1'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Release v${{ steps.ver.outputs.version }}
          file_pattern: flake.nix
          branch: ${{ github.ref_name }}
          disable_globbing: true
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>

      - id: hub
        run: |
          set -euo pipefail
          hash=$(nix develop -c bun -e 'import { pkg_of } from "./bin/pkg.ts"; console.log(pkg_of("ez/main.bend").hash)')
          if ! echo "$hash" | grep -qxE '0x[0-9a-f]+'; then
            echo "bad package hash: ${hash}"
            exit 1
          fi
          echo "hash=${hash}" >> "$GITHUB_OUTPUT"
          nix develop -c bend ez/main.bend --publish | tee /tmp/bend-publish.log
          if ! grep -q "$hash" /tmp/bend-publish.log; then
            echo "publish output did not mention ${hash}"
            cat /tmp/bend-publish.log
            exit 1
          fi

      - name: Release (changelog notes)
        if: steps.ver.outputs.notes == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }} ${{ steps.hub.outputs.hash }}
          body_path: /tmp/release-notes.md
          target_commitish: ${{ steps.commit.outputs.commit_hash || github.sha }}

      - name: Release (generated notes)
        if: steps.ver.outputs.notes != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }} ${{ steps.hub.outputs.hash }}
          generate_release_notes: true
          target_commitish: ${{ steps.commit.outputs.commit_hash || github.sha }}
