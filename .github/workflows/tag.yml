# Merges to master patch-bump flake.nix, tag vX.Y.Z, and open a GitHub Release.
# Actions → Tag still sets an explicit version or bump.
# Hub publish stays manual: Actions → Publish.
#
# The push path skips a commit whose message starts with "Release v"
# (the bump commit) so it does not bump again.
#
# Dispatch, from master:
#   - leave version empty and bump=none → tag what flake.nix says
#   - version=X.Y.Z → tag that (fails if flake.nix differs)
#   - bump=patch|minor|major → rewrite flake.nix, commit, tag the new X.Y.Z
#
# Tag and GitHub Release only; GitHub ships the source archive.

name: tag

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: "X.Y.Z to tag (empty = version in flake.nix)"
        required: false
        type: string
        default: ""
      bump:
        description: "If version is empty, bump flake.nix then tag"
        required: false
        type: choice
        options:
          - none
          - patch
          - minor
          - major
        default: none

jobs:
  tag:
    if: "github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'Release v')"
    permissions:
      contents: write
    uses: Emerging-Patterns/actions/.github/workflows/tag.yml@9523e8b294ae014fade5861c32d5ab911866acb2
    with:
      version: ${{ case(github.event_name == 'workflow_dispatch', inputs.version, '') }}
      bump: ${{ case(github.event_name == 'push', 'patch', inputs.bump) }}
