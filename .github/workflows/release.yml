# On a pushed v* tag: publish ez to bendhub, then open a GitHub Release whose
# name includes the bendhub package hash. Tag form stays vX.Y.Z.
# GitHub already ships a source archive; no native binary attach.

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@v22

      - id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if ! echo "$tag" | grep -qxE 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "skip: ${tag} is not a vX.Y.Z tag"
            exit 0
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "release ${tag} already exists"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          case "$tag" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          notes=false
          if [ -f CHANGELOG.md ]; then
            ver="${tag#v}"
            awk -v ver="$ver" '
              $0 ~ "^##[ \\[ ]+v?" ver {found=1; print; next}
              found && /^## / {exit}
              found {print}
            ' CHANGELOG.md > /tmp/release-notes.md
            if [ -s /tmp/release-notes.md ]; then
              notes=true
            fi
          fi
          echo "notes=${notes}" >> "$GITHUB_OUTPUT"

      - id: hub
        if: steps.meta.outputs.skip != 'true'
        run: |
          set -euo pipefail
          hash=$(nix develop -c bun -e 'import { pkg_of } from "./bin/pkg.ts"; console.log(pkg_of("ez/main.bend").hash)')
          if ! echo "$hash" | grep -qxE '0x[0-9a-f]+'; then
            echo "bad package hash: ${hash}"
            exit 1
          fi
          echo "hash=${hash}" >> "$GITHUB_OUTPUT"
          nix develop -c bend ez/main.bend --publish | tee /tmp/bend-publish.log
          if ! grep -q "$hash" /tmp/bend-publish.log; then
            echo "publish output did not mention ${hash}"
            cat /tmp/bend-publish.log
            exit 1
          fi

      - name: Release (changelog notes)
        if: steps.meta.outputs.skip != 'true' && steps.meta.outputs.notes == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }} ${{ steps.hub.outputs.hash }}
          body_path: /tmp/release-notes.md
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}

      - name: Release (generated notes)
        if: steps.meta.outputs.skip != 'true' && steps.meta.outputs.notes != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }} ${{ steps.hub.outputs.hash }}
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
